name: webkit-interrupt-diagnosis

# Spike-only diagnostic. It reports how often the WebKit buffer interrupt hangs and
# at which stage. It is deliberately not a required check and does not gate the
# product build: its job is to record the data.

on:
  push:
    branches: [claude/busy-wright-rooppm]
    paths:
      - 'spike/engine/**'
      - '.github/workflows/webkit-interrupt-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: webkit interrupt diagnosis (50 contexts)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and verify pinned Pyodide 314.0.7 release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pyodide-dist"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/pyodide.tar.bz2" \
            https://github.com/pyodide/pyodide/releases/download/314.0.7/pyodide-314.0.7.tar.bz2
          echo "192b5864e6e6d30ab074861af800cb8b4acb0998ef0f9342c3367448aeb86645  $RUNNER_TEMP/pyodide.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/pyodide.tar.bz2" -C "$RUNNER_TEMP/pyodide-dist"

      - name: Install harness dependencies
        working-directory: spike/engine
        run: npm ci

      - name: Install WebKit and system dependencies
        working-directory: spike/engine
        run: npx playwright install --with-deps webkit

      - name: Run 50-context WebKit interrupt diagnosis
        working-directory: spike/engine
        env:
          BROWSER: webkit
          CONTEXTS: '50'
          PYODIDE_DIST: ${{ runner.temp }}/pyodide-dist/pyodide
        run: node diagnose-interrupt.mjs

      - name: Print diagnosis to the log
        if: always()
        working-directory: spike/engine
        run: cat results/interrupt-diagnosis-webkit.json

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-interrupt-diagnosis
          path: spike/engine/results/
          if-no-files-found: warn
